<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KL ERP Live Internals Calculator</title>
  <style>
    :root {
      --bg: #070b16;
      --surface: rgba(18, 25, 49, 0.86);
      --surface-2: #192344;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --good: #34d399;
      --warn: #fbbf24;
      --danger: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* Animated ambient background */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 999px;
      filter: blur(80px);
      opacity: 0.28;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 380px; height: 380px; background: #0284c7; top: -120px; right: -80px; }
    .orb-2 { width: 320px; height: 320px; background: #4f46e5; bottom: -100px; left: -90px; animation-delay: -6s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-24px, 28px) scale(1.08); }
    }

    .container { max-width: 1120px; margin: 0 auto; padding: 28px 18px 64px; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 14px;
      margin-bottom: 20px;
      animation: fadeDown 0.5s ease-out;
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 1.85rem);
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f8fafc, #7dd3fc, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      animation: fadeDown 0.6s ease-out;
    }
    .quick-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(25, 35, 68, 0.75);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .quick-link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
    }
    .quick-link.insta { border-color: rgba(244, 114, 182, 0.35); }
    .quick-link.insta:hover { border-color: #f472b6; background: rgba(244, 114, 182, 0.14); }

    .login-card {
      background: var(--surface);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      animation: fadeUp 0.5s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      align-items: end;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      background: rgba(7, 11, 22, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .captcha-box { display: flex; align-items: center; gap: 10px; }
    .captcha-box img {
      height: 42px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      transition: transform 0.2s;
    }
    .captcha-box img:hover { transform: scale(1.03); }

    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, border-color 0.15s, filter 0.15s;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(0.98); }
    button.primary {
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      border-color: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button.primary:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    button.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      margin-top: 12px;
      color: var(--danger);
      font-size: 0.88rem;
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    .motivation-banner {
      display: none;
      margin-bottom: 18px;
      padding: 16px 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(52, 211, 153, 0.12), rgba(56, 189, 248, 0.12));
      border: 1px solid rgba(52, 211, 153, 0.3);
      animation: fadeUp 0.45s ease-out;
    }
    .motivation-title {
      font-weight: 700;
      font-size: 1.02rem;
      color: #6ee7b7;
      margin-bottom: 2px;
    }
    .motivation-sub { font-size: 0.88rem; color: var(--text); opacity: 0.9; }

    .course-card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 18px;
      overflow: hidden;
      opacity: 0;
      animation: cardEnter 0.45s ease-out forwards;
      transition: transform 0.2s, border-color 0.2s;
    }
    .course-card:hover { border-color: rgba(56, 189, 248, 0.35); }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .course-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 12px;
      background: rgba(255, 255, 255, 0.02);
    }
    .course-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .code-badge {
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 9px;
      border-radius: 7px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .course-name { font-weight: 700; font-size: 1.02rem; }
    .course-score { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
    .course-score .big { font-size: 1.35rem; font-weight: 700; color: var(--good); }
    .course-score .denom { color: var(--muted); font-size: 0.86rem; }

    .progress-wrap {
      padding: 0 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .progress-track {
      width: 100%;
      height: 7px;
      background: rgba(148, 163, 184, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8, #34d399);
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 620px; }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 10px 16px; border-bottom: 1px solid rgba(148, 163, 184, 0.08); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; }
    .pill-formative { background: rgba(129, 140, 248, 0.15); color: #a5b4fc; }
    .pill-summative { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; }
    .pill-missing { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
    .pill-ok { background: rgba(52, 211, 153, 0.15); color: var(--good); }
    input.raw-input { width: 110px; text-align: right; padding: 6px 9px; font-size: 0.88rem; }
    input.raw-input::placeholder { color: #64748b; font-style: italic; }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="container">
    <header>
      <div>
        <h1>KL ERP Live Internals Calculator</h1>
        <div class="subtitle">
          Fetches your Course Handout Evaluation Plans &amp; Internal Marks directly from KL ERP (negative marks ignored; credentials are never stored). <span style="opacity:0.6">· v16</span>
        </div>
      </div>
    </header>

    <div class="quick-links">
      <a class="quick-link" href="https://newerp.kluniversity.in" target="_blank" rel="noopener">KL New ERP</a>
      <a class="quick-link" href="https://lms.kluniversity.in" target="_blank" rel="noopener">KL LMS</a>
      <a class="quick-link" href="https://www.kluniversity.in" target="_blank" rel="noopener">KL University</a>
      <a class="quick-link insta" href="https://www.instagram.com/kluniversityofficial/" target="_blank" rel="noopener">Instagram @kluniversityofficial</a>
      <a class="quick-link" href="/how-it-works" style="border-color: rgba(52, 211, 153, 0.4); color: #6ee7b7;">How It Works (No Data Stored)</a>
      <a class="quick-link" href="/announce" style="border-color: rgba(167, 139, 250, 0.45); color: #c4b5fd;">Announcement Video</a>
    </div>

    <div class="login-card">
      <form id="fetchForm" onsubmit="submitFetch(event)">
        <div class="form-grid">
          <div>
            <label for="username">Student ID</label>
            <input id="username" type="text" placeholder="e.g. 2400040006" required />
          </div>
          <div>
            <label for="password">KL ERP Password</label>
            <input id="password" type="password" placeholder="Enter password" required />
          </div>
          <div>
            <label for="academicYear">Academic Year</label>
            <input id="academicYear" type="text" value="2026-2027" required />
          </div>
          <div>
            <label for="semester">Semester</label>
            <select id="semester">
              <option value="Odd Sem">Odd Sem</option>
              <option value="Even Sem">Even Sem</option>
              <option value="Summer Term">Summer Term</option>
            </select>
          </div>
          <div>
            <label>Verification Code (CAPTCHA)</label>
            <div class="captcha-box">
              <img id="captchaImg" alt="CAPTCHA" />
              <button type="button" onclick="loadCaptcha()">Refresh</button>
            </div>
          </div>
          <div>
            <label for="captcha">Enter CAPTCHA</label>
            <input id="captcha" type="text" placeholder="Type code" required />
          </div>
          <div>
            <button id="submitBtn" class="primary" type="submit" style="width: 100%;">
              <span class="spinner"></span>
              <span id="btnLabel">Fetch &amp; Calculate</span>
            </button>
          </div>
        </div>
        <div class="error-msg" id="errorMsg"></div>
      </form>
    </div>

    <div class="motivation-banner" id="motivationBanner">
      <div class="motivation-title" id="motivationTitle"></div>
      <div class="motivation-sub" id="motivationSub"></div>
    </div>

    <div id="coursesContainer"></div>
  </div>

  <script>
    let currentSessionId = null;
    let loadedCourses = [];
    let loadingTimer = null;

    const LOADING_STEPS = [
      'Connecting to KL ERP...',
      'Reading Handout Evaluation Plans...',
      'Fetching Internal Marks...',
      'Calculating your totals...'
    ];

    async function loadCaptcha() {
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      try {
        const res = await fetch('/api/captcha');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to load CAPTCHA');
        currentSessionId = data.session_id;
        document.getElementById('captchaImg').src = data.captcha_url;
        document.getElementById('captcha').value = '';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      }
    }

    async function submitFetch(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const btnLabel = document.getElementById('btnLabel');
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';
      btn.disabled = true;
      btn.classList.add('loading');

      let stepIdx = 0;
      btnLabel.textContent = LOADING_STEPS[0];
      loadingTimer = setInterval(() => {
        stepIdx = (stepIdx + 1) % LOADING_STEPS.length;
        btnLabel.textContent = LOADING_STEPS[stepIdx];
      }, 1600);

      try {
        const res = await fetch('/api/fetch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: currentSessionId,
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            captcha: document.getElementById('captcha').value,
            academic_year: document.getElementById('academicYear').value,
            semester: document.getElementById('semester').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          await loadCaptcha();
          throw new Error(data.error || 'Failed to fetch internals');
        }
        loadedCourses = data.courses || [];
        renderCourses(data);
        await loadCaptcha();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
      } finally {
        clearInterval(loadingTimer);
        btn.disabled = false;
        btn.classList.remove('loading');
        btnLabel.textContent = 'Fetch & Calculate';
      }
    }

    function parseRawMarks(input) {
      const str = String(input ?? '').trim();
      if (!str) return null;
      const parts = str.split(/[\s,]+/).map(Number).filter(n => !Number.isNaN(n) && n >= 0);
      return parts.length ? parts.reduce((a, b) => a + b, 0) : null;
    }

    function updateRaw(ci, ri, value) {
      loadedCourses[ci].components[ri].raw = parseRawMarks(value);
      renderCourses();
    }

    function updateMotivation(meta) {
      const banner = document.getElementById('motivationBanner');
      const title = document.getElementById('motivationTitle');
      const sub = document.getElementById('motivationSub');
      if (!loadedCourses.length) {
        banner.style.display = 'none';
        return;
      }

      let earned = 0, uploaded = 0;
      for (const c of loadedCourses) {
        for (const comp of c.components) {
          if (comp.raw !== null && comp.raw !== '' && Number(comp.raw) >= 0) {
            earned += (Number(comp.raw) / comp.maxMarks) * comp.weight;
            uploaded += comp.weight;
          }
        }
      }
      const pct = uploaded > 0 ? (earned / uploaded) * 100 : 0;
      let msg = 'Keep pushing — every mark you add in the remaining components counts!';
      if (pct >= 88) msg = 'Outstanding momentum! You are crushing your internals — keep this consistency going!';
      else if (pct >= 75) msg = 'Strong work so far! A focused push on the remaining components will lock in a great grade.';
      else if (pct >= 60) msg = 'Solid base! Use the editable Raw Marks below to plan what you need next.';

      title.textContent = msg;
      sub.textContent = meta
        ? `Loaded ${loadedCourses.length} credited courses for ${meta.student_id} (${meta.academic_year} · ${meta.semester}) · Current uploaded average: ${pct.toFixed(1)}%`
        : `Current uploaded average across ${loadedCourses.length} courses: ${pct.toFixed(1)}% (you can edit any Raw Marks cell to test targets)`;
      banner.style.display = 'block';
    }

    function renderCourses(meta) {
      updateMotivation(meta);
      const html = loadedCourses.map((course, ci) => {
        let earned = 0, uploadedWeight = 0, totalWeight = 0;
        for (const c of course.components) {
          totalWeight += c.weight;
          if (c.raw !== null && c.raw !== '' && Number(c.raw) >= 0) {
            earned += (Number(c.raw) / c.maxMarks) * c.weight;
            uploadedWeight += c.weight;
          }
        }
        const barPct = totalWeight > 0 ? Math.min(100, (earned / totalWeight) * 100).toFixed(1) : 0;

        const rows = course.components.map((comp, ri) => {
          const hasRaw = comp.raw !== null && comp.raw !== '' && Number(comp.raw) >= 0;
          const weighted = hasRaw ? ((Number(comp.raw) / comp.maxMarks) * comp.weight).toFixed(2) : '—';
          const statusBadge = hasRaw
            ? '<span class="pill pill-ok">Uploaded</span>'
            : '<span class="pill pill-missing">Not uploaded</span>';
          const typeBadge = comp.type === 'Formative'
            ? '<span class="pill pill-formative">Formative</span>'
            : '<span class="pill pill-summative">Summative</span>';

          return `
            <tr>
              <td>${comp.name}</td>
              <td>${typeBadge}</td>
              <td class="num">${comp.maxMarks}</td>
              <td class="num">${comp.weight}</td>
              <td class="num">
                <input class="raw-input" type="text" value="${hasRaw ? comp.raw : ''}" placeholder="Not uploaded" onchange="updateRaw(${ci}, ${ri}, this.value)" />
              </td>
              <td class="num"><strong>${weighted}</strong></td>
              <td>${statusBadge}</td>
            </tr>
          `;
        }).join('');

        return `
          <div class="course-card" style="animation-delay: ${ci * 70}ms;">
            <div class="course-header">
              <div class="course-title">
                <span class="code-badge">${course.code}</span>
                <span class="course-name">${course.name}</span>
              </div>
              <div class="course-score">
                <span class="big">${earned.toFixed(2)}</span>
                <span class="denom">/ ${uploadedWeight} uploaded (${totalWeight} total internal)</span>
              </div>
            </div>
            <div class="progress-wrap">
              <div class="progress-track">
                <div class="progress-fill" data-width="${barPct}%"></div>
              </div>
            </div>
            <div class="table-scroll">
              <table>
                <thead>
                  <tr>
                    <th>Evaluation Component</th>
                    <th>Type</th>
                    <th class="num">Max Marks</th>
                    <th class="num">Weightage</th>
                    <th class="num">Raw Marks</th>
                    <th class="num">Weighted</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('coursesContainer').innerHTML = html;
      requestAnimationFrame(() => {
        document.querySelectorAll('.progress-fill').forEach(el => {
          el.style.width = el.dataset.width;
        });
      });
    }

    loadCaptcha();
  </script>
</body>
</html>
